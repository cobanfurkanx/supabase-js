name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@e259106b7826fcbe44f329f16845816bd424bb5d # capability-matrix/v1.18.0
    with:
      base-branch: master
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}
